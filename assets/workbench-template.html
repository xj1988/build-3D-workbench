<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 工作台</title>
<!--
  通用 3D 工作台引擎（build-3d-workbench skill）
  ─────────────────────────────────────────────
  只改 SCENE_BEGIN / SCENE_END 之间的 JSON 就能换底座、换主题、换建筑、换文字。
  代码分节锚点：搜索 "§数字" 即可跳转，例如 §7 KITS 是建筑积木库。
  不要删除任何 BEGIN/END 标记，生成脚本依赖它们。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* §CSS 颜色全部来自 CSS 变量，由主题在运行时写入（见 §2 THEMES.css） */
:root{
  --paper:#F3EBDD; --paper2:#FBF6EC; --accent:#9DB8D6; --accent2:#5F86B3; --olive:#A7B58A;
  --ink:#2E3A4F; --ink2:#5B6679; --line:rgba(46,58,79,.14); --shadow:rgba(46,58,79,.14);
  --hand:"Long Cang","Kaiti SC","STKaiti","KaiTi",cursive;
  --ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;background:var(--paper)}
#c{position:fixed;inset:0;z-index:1;display:block;width:100%;height:100%;outline:none;touch-action:none}
.ui{position:fixed;z-index:5;transition:opacity .4s ease,transform .4s ease}
body.clean .ui,body.clean #labels{opacity:0;pointer-events:none}

/* 标题 */
#brand{left:84px;top:20px;max-width:46vw;pointer-events:none}
#brand h1{margin:0;font-family:var(--hand);font-weight:400;font-size:46px;line-height:1.05;letter-spacing:2px}
#brand h1 span{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 55%,transparent) 62%,color-mix(in srgb,var(--accent) 55%,transparent) 90%,transparent 90%)}
#brand .sub{margin-top:8px;font-size:12.5px;color:var(--ink2);letter-spacing:.5px}
body.night #brand h1{color:#F3EBDD}body.night #brand .sub{color:#C5CDDC}

/* 计数卡片（纸胶带） */
#stats{right:24px;top:22px;display:flex;gap:12px}
.stat{position:relative;background:var(--paper2);border-radius:6px;padding:12px 16px 10px;min-width:92px;box-shadow:0 6px 18px var(--shadow),0 1px 0 rgba(46,58,79,.06);transform:rotate(var(--r,0deg))}
.stat::before{content:"";position:absolute;left:50%;top:-8px;width:44px;height:16px;transform:translateX(-50%) rotate(-3deg);background:color-mix(in srgb,var(--olive) 60%,transparent);border-radius:2px}
.stat:nth-child(2)::before{background:color-mix(in srgb,var(--accent) 65%,transparent)}
.stat:nth-child(3)::before{background:color-mix(in srgb,var(--accent2) 40%,transparent)}
.stat .k{font-size:11.5px;color:var(--ink2)}
.stat .v{font-family:var(--hand);font-size:30px;line-height:1.1;margin-top:2px}

/* 左侧工具条 */
#tools{left:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;padding:8px;background:color-mix(in srgb,var(--paper2) 84%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;box-shadow:0 8px 24px var(--shadow)}
#tools .sep{height:1px;background:var(--line);margin:4px 6px}
.tb{position:relative;width:40px;height:40px;border:0;border-radius:11px;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.tb:hover{background:rgba(46,58,79,.07)}
.tb.on{background:var(--ink);color:var(--paper2)}
.tb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb .tt{position:absolute;left:50px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--ink);color:var(--paper2);font-size:12px;padding:5px 9px;border-radius:7px;opacity:0;pointer-events:none;transition:opacity .15s}
.tb:hover .tt{opacity:1}

/* 底部进度轨道 */
#track{left:50%;bottom:22px;transform:translateX(-50%);background:color-mix(in srgb,var(--paper2) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px;padding:10px 22px 12px;box-shadow:0 10px 28px var(--shadow);min-width:min(680px,92vw)}
#track .now{font-size:12px;color:var(--ink2);text-align:center;margin-bottom:8px}
#track .now b{color:var(--ink);font-weight:600}
#nodes{position:relative;display:flex;justify-content:space-between;align-items:flex-start}
#nodes::before{content:"";position:absolute;left:22px;right:22px;top:15px;border-top:2px dashed rgba(46,58,79,.22)}
#nodes .bar{position:absolute;left:22px;top:14px;height:4px;border-radius:2px;background:var(--accent);transition:width .8s ease}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;width:64px;background:none;border:0;padding:0;font-family:inherit;color:inherit}
.node .dot{width:32px;height:32px;border-radius:50%;background:var(--paper2);border:2px solid rgba(46,58,79,.25);display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:19px;transition:all .3s}
.node .nm{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.node.done .dot{background:var(--olive);border-color:var(--olive);color:#fff}
.node.doing .dot{background:var(--accent);border-color:var(--accent2);color:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 35%,transparent)}
.node:hover .dot{transform:translateY(-2px)}

/* 翻页导航（pages ≥2 时显示） */
#pageNav{right:24px;bottom:22px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--paper2) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px;padding:8px 14px;box-shadow:0 10px 28px var(--shadow)}
#pageNav .pg{width:34px;height:34px;border:0;border-radius:50%;background:rgba(46,58,79,.07);color:var(--ink);font-size:20px;font-family:var(--hand);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;padding:0 2px 3px}
#pageNav .pg:hover:not([disabled]){background:var(--ink);color:var(--paper2);transform:translateY(-1px)}
#pageNav .pg[disabled]{opacity:.32;cursor:default}
#pgChip{font-size:12px;color:var(--ink2);min-width:56px;text-align:center;letter-spacing:.5px;white-space:nowrap}
body.walking #pageNav{opacity:0;pointer-events:none}

/* 3D 浮标 */
#labels{position:fixed;inset:0;z-index:3;pointer-events:none;transition:opacity .4s}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;background:color-mix(in srgb,var(--paper2) 93%,transparent);border-radius:16px;padding:4px 11px 4px 5px;display:flex;gap:6px;align-items:center;box-shadow:0 4px 14px var(--shadow);transition:box-shadow .2s,background .3s;font-size:12px}
.lab::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.lab .n{width:19px;height:19px;border-radius:50%;background:var(--ink);color:var(--paper2);font-family:var(--hand);font-size:15px;display:flex;align-items:center;justify-content:center}
.lab .t{font-weight:600;font-size:12px}
.lab .i{font-size:10.5px;color:var(--ink2);margin-top:1px;display:none}
.lab.focus .i,.lab.active .i,.lab:hover .i{display:block}
.lab.active,.lab:hover{box-shadow:0 0 0 2px var(--ink),0 8px 20px var(--shadow)}
.lab.focus{box-shadow:0 0 0 2px var(--accent),0 8px 20px var(--shadow)}
.lab.focus .n{background:var(--accent2)}
.lab.near{box-shadow:0 0 0 2px var(--accent2),0 8px 20px var(--shadow)}

/* 详情面板 */
#panel{right:24px;top:118px;width:330px;max-height:calc(100vh - 250px);overflow:auto;background:var(--paper2);border-radius:12px;padding:20px 20px 18px;box-shadow:0 14px 40px var(--shadow);transform:translateX(380px);opacity:0;pointer-events:none}
#panel.open{transform:none;opacity:1;pointer-events:auto}
#panel .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink2)}
#panel h2{margin:0 0 2px;font-family:var(--hand);font-weight:400;font-size:32px}
#panel .lead{font-size:12.5px;color:var(--ink2);margin-bottom:14px;line-height:1.7}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;gap:10px}
.row:last-child{border-bottom:0}
.row .s{color:var(--ink2);font-size:12px;white-space:nowrap}
.prog{height:8px;background:rgba(46,58,79,.08);border-radius:4px;overflow:hidden;margin:5px 0 12px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .6s}
.plabel{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{flex:1;border-radius:8px;padding:8px 6px;text-align:center;font-size:11.5px;color:var(--ink2);background:rgba(46,58,79,.05)}
.chip b{display:block;font-family:var(--hand);font-size:26px;font-weight:400;color:var(--ink)}
label.chk{display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;cursor:pointer}
label.chk input{accent-color:var(--accent2);width:15px;height:15px}
label.chk.done span{text-decoration:line-through;color:var(--ink2)}
.ptext{white-space:pre-wrap;font-size:12.5px;line-height:1.8;color:var(--ink);background:rgba(46,58,79,.04);border-radius:8px;padding:10px 12px;margin-top:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tags span{font-size:11.5px;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--ink)}
.sec{font-size:11.5px;color:var(--ink2);margin:12px 0 2px;letter-spacing:1px}

/* 隐私打码 */
body.private .num{filter:blur(7px);user-select:none}

/* 取景框 */
#frame{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
body.framing #frame{display:block}
#frame .box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 9999px rgba(20,26,40,.38);border:1.5px dashed rgba(255,255,255,.85);border-radius:4px}
#frame .box span{position:absolute;top:-24px;left:0;color:#fff;font-size:12px;opacity:.85}

/* 编辑弹窗 */
#modal{position:fixed;inset:0;z-index:20;background:rgba(20,26,40,.35);display:none;align-items:center;justify-content:center;padding:20px}
#modal.open{display:flex}
#modal .card{background:var(--paper2);border-radius:14px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(20,26,40,.3)}
#modal h3{margin:0 0 4px;font-family:var(--hand);font-weight:400;font-size:34px}
#modal p.h{margin:0 0 14px;font-size:12.5px;color:var(--ink2);line-height:1.7}
#modal .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
#modal label.f{display:block;font-size:12px;color:var(--ink2)}
#modal input,#modal textarea,#modal select{width:100%;margin-top:4px;font:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid rgba(46,58,79,.18);border-radius:8px;padding:7px 9px;outline:none}
#modal textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.55;resize:vertical}
#modal .full{grid-column:1/-1}
#modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;align-items:center}
.btn{border:0;border-radius:9px;padding:9px 16px;font:inherit;font-size:13px;cursor:pointer;background:rgba(46,58,79,.08);color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper2)}
#modal .msg{margin-right:auto;font-size:12px;color:var(--accent2)}

/* 漫步 */
#meTag{position:fixed;left:0;top:0;z-index:4;pointer-events:none;display:none;flex-direction:column;align-items:center;gap:4px}
body.walking #meTag{display:flex}
#meTag span{background:var(--accent2);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;box-shadow:0 3px 10px var(--shadow)}
#meTag em{font-style:normal;font-size:12px;background:var(--ink);color:var(--paper2);padding:5px 10px;border-radius:9px;white-space:nowrap;display:none;order:-1}
#meTag.hint em{display:block}
#walkHelp{left:50%;bottom:118px;transform:translateX(-50%);background:rgba(46,58,79,.82);color:#F3EBDD;font-size:12px;padding:7px 14px;border-radius:20px;white-space:nowrap;opacity:0;pointer-events:none}
body.walking #walkHelp{opacity:1}

/* 加载 / 提示 */
#loading{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 30%,var(--paper2),var(--paper));font-family:var(--hand);font-size:30px;color:var(--ink);transition:opacity .8s}
#loading.hide{opacity:0;pointer-events:none}
#loading small{display:block;font-family:var(--ui);font-size:12px;color:var(--ink2);margin-top:6px;text-align:center}
#hint{position:fixed;z-index:9;transition:opacity .5s;left:50%;top:18px;transform:translateX(-50%);font-size:12px;color:var(--ink2);background:color-mix(in srgb,var(--paper2) 80%,transparent);padding:5px 12px;border-radius:20px;opacity:0;pointer-events:none}
#hint.show{opacity:1}
#toast{position:fixed;z-index:25;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--paper2);font-size:12.5px;padding:7px 14px;border-radius:18px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

@media (max-width:820px){
  #brand{left:70px;max-width:60vw}#brand h1{font-size:30px}
  #stats{top:auto;bottom:118px;right:10px;gap:8px}.stat{min-width:70px;padding:9px 10px 7px}.stat .v{font-size:22px}
  #tools{left:8px}.node .nm{display:none}.node{width:36px}
  #panel{left:12px;right:12px;width:auto;top:auto;bottom:110px;max-height:45vh}
  #pageNav{left:50%;right:auto;bottom:auto;top:14px;transform:translateX(-50%);padding:5px 10px}
}
</style>
</head>
<body class="morning">
<canvas id="c" tabindex="0"></canvas>
<div id="labels"></div>
<div id="frame"><div class="box"><span id="frameTxt">取景参考</span></div></div>

<div class="ui" id="brand"><h1><span id="title">3D 工作台</span></h1><div class="sub" id="sub"></div></div>
<div class="ui" id="stats"></div>

<div class="ui" id="tools">
  <button class="tb on" data-mode="morning"><svg viewBox="0 0 24 24"><path d="M4 17h16M7 17a5 5 0 0 1 10 0M12 6V4M5.6 9.6 4.2 8.2M18.4 9.6l1.4-1.4"/></svg><span class="tt" data-tt="morning">晨间</span></button>
  <button class="tb" data-mode="afternoon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg><span class="tt" data-tt="afternoon">午后</span></button>
  <button class="tb" data-mode="night"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><span class="tt" data-tt="night">深夜</span></button>
  <div class="sep"></div>
  <button class="tb" id="bHome"><svg viewBox="0 0 24 24"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3"/><circle cx="12" cy="12" r="3"/></svg><span class="tt">回到全景（0）</span></button>
  <button class="tb" id="bDemo"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span class="tt">一键巡游（D）</span></button>
  <button class="tb" id="bWalk"><svg viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="2"/><path d="M10 21l2-6 3 3v3M9 11l3-3 3 2 3 1M12 8l-1 7"/></svg><span class="tt">漫步（P）· WASD 走 · Shift 跑 · E 进入 · Esc 退出</span></button>
  <button class="tb" id="bTheme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.6-.9 1.2-1.8-.5-1 .1-2.2 1.3-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10Z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="7.5" r="1"/></svg><span class="tt" id="themeTT">切换配色（T）</span></button>
  <button class="tb" id="bEdit"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="M14 6l4 4"/></svg><span class="tt">编辑内容</span></button>
  <div class="sep"></div>
  <button class="tb" id="bShot"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="tt">保存截图（S）</span></button>
  <button class="tb" id="bFrame"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="1.5"/></svg><span class="tt">取景参考框（F）</span></button>
  <button class="tb" id="bPriv"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 4l16 16"/></svg><span class="tt">数字打码</span></button>
  <button class="tb" id="bClean"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg><span class="tt">隐藏界面录屏（H）</span></button>
</div>

<div class="ui" id="track"><div class="now" id="now"></div><div id="nodes"><div class="bar" id="bar"></div></div></div>
<div class="ui" id="pageNav" style="display:none"><button class="pg" id="pgPrev" aria-label="上一页（←）">‹</button><span id="pgChip"></span><button class="pg" id="pgNext" aria-label="下一页（→）">›</button></div>
<div class="ui" id="panel"><button class="x" id="pClose" aria-label="关闭">×</button><div id="pBody"></div></div>
<div class="ui" id="walkHelp">WASD / 方向键移动 · Shift 跑 · 点地面走过去 · 靠近建筑按 E · Esc 退出</div>
<div id="hint">按 H 或 Esc 恢复界面</div>
<div id="toast"></div>

<div id="modal"><div class="card">
  <h3>编辑内容</h3>
  <p class="h">修改只保存在这台电脑的这个浏览器里，不会改动 HTML 文件。改文字、数字、面板会立刻生效；改底座、建筑种类、位置或数量会自动刷新页面重新摆放。</p>
  <div class="grid">
    <label class="f">标题<input id="fTitle"></label>
    <label class="f">副标题<input id="fSub"></label>
    <label class="f">漫步昵称<input id="fNick"></label>
    <label class="f">配色主题<select id="fTheme"></select></label>
    <label class="f full">全部内容（JSON，字段说明见 skill 的 config-schema.md）<textarea id="fJson" rows="18" spellcheck="false"></textarea></label>
  </div>
  <div class="acts"><span class="msg" id="fMsg"></span><button class="btn" id="fReset">恢复初始内容</button><button class="btn" id="fCancel">取消</button><button class="btn pri" id="fApply">应用</button></div>
</div></div>

<div id="loading"><div>正在搭建小世界…<small id="loadMsg">加载 3D 引擎</small></div></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
<script>
window.addEventListener('error',e=>{const m=document.getElementById('loadMsg');if(m)m.textContent='出错了：'+(e.message||e)});
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================================================================
   §1 SCENE 配置 —— 唯一需要改的地方（生成脚本会整段替换）
   ================================================================ */
const SCENE_DEFAULT = /* SCENE_BEGIN */{
  "title": "我的灵感小岛",
  "subtitle": "把每天的小事，种成一座会发光的岛",
  "nickname": "漫游者",
  "storageKey": "wb-template-v2",
  "base": "island",

const clone=o=>JSON.parse(JSON.stringify(o));

function loadScene(){let s=clone(SCENE_DEFAULT);try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(saved&&saved.scene&&typeof saved.scene==='object'){s=Object.assign(s,saved.scene);s.storageKey=SCENE_DEFAULT.storageKey;if(Number.isInteger(saved.page))restoredPage=Math.max(0,Math.min(3,saved.page|0))}}catch(e){}return normalize(s)}
/** 页级 zones 与顶层 zones 共用同一套规整 */
function normZones(zs,tag){zs=(Array.isArray(zs)?zs:[]).filter(z=>z&&typeof z==='object').slice(0,9);
  zs.forEach((z,i)=>{if(!KIT_NAMES.includes(z.kit))z.kit='cottage';z.id=z.id||(tag===undefined?'zone'+i:'zone'+tag+'_'+i);z.name=String(z.name||('区域 '+(i+1)));z.panel=z.panel&&typeof z.panel==='object'?z.panel:{}});return zs}
function normalize(s){
  s.base=['book','island','diorama'].includes(s.base)?s.base:'island';
  s.theme=THEMES[s.theme]?s.theme:'cream';
  s.quality=s.quality==='low'?'low':'standard';
  s.river=Object.assign({enabled:true,bridges:[0.3,0.72]},s.river||{});
  s.decor=Object.assign({trees:1,flowers:1,walkers:10,planes:3,boats:6,garlands:true,sparkles:true},s.decor||{});
  s.modes=Object.assign({morning:{name:'晨间'},afternoon:{name:'午后'},night:{name:'深夜'}},s.modes||{});
  s.stats=Array.isArray(s.stats)?s.stats.slice(0,4):[];
  s.zones=normZones(s.zones);
  /* pages：可选 2~4 页，页级拥有 zones/pageNotes/modes；其余字段（stats/track/river/decor/base/theme）全局 */
  if(Array.isArray(s.pages)&&s.pages.filter(p=>p&&typeof p==='object').length>1){
    s.pages=s.pages.filter(p=>p&&typeof p==='object').slice(0,4);
    s.pages.forEach((p,pi)=>{p.name=String(p.name||('第 '+(pi+1)+' 页'));
      p.pageNotes=Array.isArray(p.pageNotes)?p.pageNotes.map(v=>String(v)).slice(0,3):undefined;
      p.modes=Object.assign({morning:{name:'晨间'},afternoon:{name:'午后'},night:{name:'深夜'}},p.modes&&typeof p.modes==='object'?p.modes:{});
      p.decor=(p.decor&&typeof p.decor==='object')?Object.assign({},s.decor,p.decor):undefined;
      p.backdrop=BACKDROP_NAMES.includes(p.backdrop)?p.backdrop:undefined;
      p.zones=normZones(p.zones,pi)});
  }else if(Array.isArray(s.pages)&&s.pages.length===1&&!s.zones.length){const p0=s.pages[0]||{};
    s.zones=normZones(p0.zones);if(Array.isArray(p0.pageNotes))s.pageNotes=p0.pageNotes.slice(0,3);
    if(p0.modes&&typeof p0.modes==='object')s.modes=Object.assign({morning:{name:'晨间'},afternoon:{name:'午后'},night:{name:'深夜'}},p0.modes);
    s.pages=undefined;
  }else s.pages=undefined;
  return s}

    const RN=LOW?48:72;const ringPts=rings.map(([d,s],k)=>{const arr=[];for(let j=0;j<=RN;j++){const a=j/RN*Math.PI*2;const jit=k<2?0:(Math.sin(j*12.9898+k*78.233)*43758.5453%1)*0.18;const r=edgeR(a)*s*(1+jit*0.25);const x=Math.cos(a)*r,z=Math.sin(a)*r;arr.push([x,(k===0?ground(x*0.999,z*0.999):TOP-0.32)-d-(k>0?0.02:0),z])}return arr});

  _waterTex.wrapS=_waterTex.wrapT=THREE.RepeatWrapping;themeHooks.push(()=>redraw(_waterTex));
  _waterMat=glow(0xffffff,'water',0.05,0.35,{map:_waterTex,roughness:.25,metalness:.05});updaters.push(dt=>{_waterTex.offset.x-=dt*0.28});return _waterMat}
const bridgeList=[];
function buildRiver(){if(!HAS_RIVER)return;
  const wfn=t=>(0.2+0.24*Math.min(1,t*4))*(1+0.1*Math.sin(t*40));
  const ribbon=(widthFn,off)=>{const N=300,pos=[],uv=[],idx=[];const L=riverCurve.getLength();
    for(let i=0;i<=N;i++){const t=i/N;const {p,n}=riverAt(t);const w=widthFn(t);const a=[p.x+n.x*w,p.z+n.z*w],b=[p.x-n.x*w,p.z-n.z*w];
      pos.push(a[0],ground(a[0],a[1])+off,a[1],b[0],ground(b[0],b[1])+off,b[1]);uv.push(t*L/1.6,0,t*L/1.6,1);if(i<N){const k=i*2;idx.push(k,k+2,k+1,k+1,k+2,k+3)}}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return g};
  const shore=new THREE.Mesh(ribbon(t=>wfn(t)+0.17,0.014),std('waterLight',{roughness:.95}));shore.receiveShadow=true;world.add(shore);
  const water=new THREE.Mesh(ribbon(wfn,0.032),waterMat());water.receiveShadow=true;world.add(water);
  const e0=RIVER_PTS[0],e1=RIVER_PTS[RIVER_PTS.length-1];pond(e0[0],e0[1],0.42);pond(e1[0],e1[1],0.5);
  (SCENE.river.bridges||[]).forEach(t=>bridge(clamp(+t||0.5,0.08,0.92)))}
function bridge(t){const {p,n}=riverAt(t);const g=new THREE.Group();g.position.set(p.x,ground(p.x,p.z)+0.02,p.z);g.rotation.y=-Math.atan2(n.z,n.x);world.add(g);
  const pts=[];for(let i=0;i<=20;i++){const u=-1+i/10;pts.push([u*1.0,0.36*(1-u*u)+0.1])}for(let i=20;i>=0;i--){const u=-1+i/10;pts.push([u*1.0,0.36*(1-u*u)])}
  const gg=extrude(paperShape(pts),0.62);gg.translate(0,0,-0.31);add(g,gg,std('wood'));
  for(const s of[-1,1]){const rp=[];for(let i=0;i<=10;i++){const u=-0.9+i*0.18;const y=0.36*(1-u*u)+0.1;rp.push(new THREE.Vector3(u,y+0.22,s*0.29));add(g,cyl(0.018,0.018,0.22,6),std('wood2'),u,y+0.11,s*0.29)}
    add(g,new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rp),20,0.02,5,false),std('wood2'))}
  extraBlocks.push([p.x,p.z,0.9,1]);bridgeList.push({p:p.clone(),n:n.clone()})}
function onBridge(x,z){for(const b of bridgeList){const dx=x-b.p.x,dz=z-b.p.z;const along=dx*b.n.x+dz*b.n.z,side=-dx*b.n.z+dz*b.n.x;if(Math.abs(along)<1.0&&Math.abs(side)<0.3)return 0.36*(1-along*along)+0.1}return -1}
/** blocked：散布装饰时判断占用（pi 缺省=当前页；装饰只避让自己页的区域，随页换装） */
function blocked(x,z,pad=0,pi=curPage){if(!BASE.inside(x,z,pad))return true;
  for(const zr of (pageRT[pi]||[]))if(Math.hypot(x-zr.x,z-zr.z)<zr.r+pad)return true;
  for(const c of extraBlocks)if(Math.hypot(x-c[0],z-c[1])<c[2]+pad)return true;
  return HAS_RIVER&&riverDist(x,z)<0.62+pad}
function pushExtra(e,extra){extraBlocks.push(e);if(extra)extra.push(e)}

  const sw=Math.sin(walk.phase)*(moving?0.7:0);walk.legs[0].rotation.x=sw;walk.legs[1].rotation.x=-sw;walk.arms[0].rotation.x=-sw*0.9;walk.arms[1].rotation.x=sw*0.9;
  walk.skirt.rotation.z=Math.sin(walk.phase*0.5)*(moving?0.06:0.015);walk.buns.forEach((b,i)=>{b.position.y=0.105+Math.abs(Math.sin(walk.phase+i))*(moving?0.01:0)});
  walk.head.rotation.y=moving?0:Math.sin(t*0.6)*0.35;walk.head.rotation.z=moving?Math.sin(walk.phase)*0.04:Math.sin(t*0.9)*0.05;{const bl=(t%3.6)<0.13;walk.eyes.forEach(e=>e.scale.y=bl?0.15:1)}
  plBody.position.y=moving?Math.abs(Math.sin(walk.phase))*0.04:Math.sin(t*2)*0.006;
  for(const s of dust){if(!s.visible)continue;s.userData.t+=dt;const u=s.userData.t/0.7;if(u>=1){s.visible=false;continue}s.position.y+=dt*0.25;s.material.opacity=(1-u)*0.8;s.scale.setScalar(0.12+u*0.2)}
  if(!fly){const dlt=player.position.clone().sub(walk.last);camera.position.add(dlt);controls.target.add(dlt)}walk.last.copy(player.position);
  let near=-1,nd=99;zoneRT.forEach((z,i)=>{const d=Math.hypot(player.position.x-z.x,player.position.z-z.z);if(d<z.r+0.7&&d<nd){nd=d;near=i}});
  if(near!==walk.near){walk.near=near;meHint.textContent=near>=0?`按 E 进入「${zoneRT[near].cfg.name}」`:'';meTag.classList.toggle('hint',near>=0);labelEls.forEach((l,i)=>l.classList.toggle('near',i===near))}
  const v=player.position.clone();v.y+=0.95;v.project(camera);meTag.style.display=v.z>1?'none':'';meTag.style.transform=`translate(-50%,-100%) translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px)`});

/* ================================================================
   §18 主循环 / 启动
   ================================================================ */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  const pr=composer._pixelRatio||1;tiltH.uniforms.uRes.value.set(w*pr,h*pr);tiltV.uniforms.uRes.value.set(w*pr,h*pr);refreshTrack();if(document.body.classList.contains('framing'))layoutFrame()}
addEventListener('resize',resize);
const clock=new THREE.Clock();const tmp=new THREE.Vector3();
function frame(){const dt=Math.min(clock.getDelta(),0.05);const t=clock.elapsedTime;
  if(fly){fly.t+=dt/fly.dur;const k=ease(Math.min(1,fly.t));camera.position.lerpVectors(fly.p0,fly.p1,k);controls.target.lerpVectors(fly.t0,fly.t1,k);if(fly.t>=1){const r=fly.res;fly=null;controls.enabled=true;r()}}
  controls.update();{const cd=camera.position.distanceTo(controls.target);scene.fog.near=cd*0.95;scene.fog.far=cd*3.4}applyMode(dt);for(const f of updaters)f(dt,t);
  composer.render(dt);const w=innerWidth,h=innerHeight;
  labelEls.forEach((d,i)=>{const z=zoneRT[i];tmp.set(z.x,ground(z.x,z.z)+z.h,z.z).project(camera);if(tmp.z>1){d.style.display='none';return}d.style.display='';d.style.transform=`translate(-50%,-100%) translate(${(tmp.x*.5+.5)*w}px,${(-tmp.y*.5+.5)*h}px)`;d.style.zIndex=Math.round((1-tmp.z)*1000)});
  requestAnimationFrame(frame)}
window.__WB={ready:false,scene,camera,renderer,SCENE:()=>SCENE,get zones(){return zoneRT},base:()=>SCENE.base,inside:(x,z,p)=>BASE.inside(x,z,p),ground,applyTheme,setMode,selectZone,goHome,enterWalk,exitWalk,walkable,runDemo,THEMES,KITS:KIT_NAMES,page:()=>({cur:curPage,total:PAGES.length,multi:MULTI}),turnPage,
  pump:(dt=0.05)=>{for(const f of updaters)f(dt,performance.now()/1000);composer.render(dt)}};
(async()=>{
  $('loadMsg').textContent='准备字体';
  try{await Promise.race([document.fonts.load('40px "Long Cang"','灵感从这里冒出来今天也好好生活慢慢来比较快0123456789%'),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  $('loadMsg').textContent='摆放小世界';
  BASE.build();buildRiver();
  for(let pi=0;pi<PAGES.length;pi++)buildZones(pi);
  baseExtra.push(...extraBlocks);   // 底座级碰撞项快照（桥/池塘），页级项见 §8.5
  for(let pi=0;pi<PAGES.length;pi++){buildBackdrop(pi);buildDecor(pi)}
  mountPage(curPage);buildDecorGlobal();
  applyTheme(SCENE.theme);meName.textContent=SCENE.nickname||'漫游者';applyContent();refreshPageChip();resize();
  const v=overviewView();camera.position.copy(v.pos).add(new THREE.Vector3(7,6,9));controls.target.copy(v.target);
  setMode('morning',true);frame();
  setTimeout(()=>{$('loading').classList.add('hide');flyTo(v.pos,v.target,2.4).then(()=>{window.__WB.ready=true})},150);
})();
